[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  "../ai/**",
  "../assistant/**",
  "../collab/**",
  "../compiler/**",
  "../create/**",
  "../desktop/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
]
coverageThreshold = { lines = 0.89, functions = 0.80 }
